name: native_ai_bridge_generator
description: Code generators for native_ai_bridge. Creates Tool classes from annotated Dart models, and Siri AI App Intents and app skills.
version: 0.2.0-dev.1
homepage: https://github.com/AbdurahmanAlmehdi/native_ai_bridge_library/tree/main/native_ai_bridge_generator
repository: https://github.com/AbdurahmanAlmehdi/native_ai_bridge_library/tree/main/native_ai_bridge_generator
issue_tracker: https://github.com/AbdurahmanAlmehdi/native_ai_bridge_library/issues

environment:
  sdk: ^3.9.0

dependencies:
  analyzer: ">=10.0.0 <15.0.0"
  args: ^2.5.0
  build: ">=4.0.0 <6.0.0"
  native_ai_bridge: ^0.2.2
  path: ^1.9.0
  source_gen: ^4.1.2
  yaml: ^3.1.2

dev_dependencies:
  build_test: ^3.3.2
  test: ^1.26.3
  very_good_analysis: ^10.0.0

dependency_overrides:
  native_ai_bridge:
    path: ../native_ai_bridge
